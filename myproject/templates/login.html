{% extends 'base.html' %}
{% block content %}
<div style="max-width: 420px; margin: 50px auto; background: #ffffff; padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;">
    <h2 style="font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; text-align: center;">Sign In</h2>
    <p style="font-size: 13px; color: #64748b; margin-bottom: 24px; text-align: center;">Login to track alerts & bookmark jobs</p>

    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">Username</label>
            <input type="text" name="username" required placeholder="Enter username" style="width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none;">
        </div>
        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">Password</label>
            <input type="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none;">
        </div>
        <button type="submit" style="width: 100%; background: #2563eb; color: #ffffff; padding: 12px; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer;">Sign In</button>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 13px; color: #64748b;">
        <a href="{% url 'forgot_password' %}" style="color: #2563eb; text-decoration: none;">Forgot Password?</a> • 
        <a href="{% url 'register' %}" style="color: #2563eb; font-weight: 700; text-decoration: none;">Create Account</a>
    </div>
</div>
{% endblock %}
