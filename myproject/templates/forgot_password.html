{% extends 'base.html' %}
{% block content %}
<div style="max-width: 420px; margin: 50px auto; background: #ffffff; padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;">
    <h2 style="font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; text-align: center;">Reset Password</h2>
    <p style="font-size: 13px; color: #64748b; margin-bottom: 24px; text-align: center;">Enter your registered email address to receive an OTP.</p>

    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">Email Address</label>
            <input type="email" name="email" required placeholder="name@example.com" style="width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none;">
        </div>
        <button type="submit" style="width: 100%; background: #2563eb; color: #ffffff; padding: 12px; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer;">Send OTP to Email</button>
    </form>
</div>
{% endblock %}
